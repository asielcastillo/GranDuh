<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Granduh - Buffet e Eventos</title>
    <!-- Link para o Font Awesome para os ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-gray-black">
    <!-- Contêiner principal para toda a página, que receberá o background e o overlay via CSS -->
    <div class="page-container">
        <!-- Seção do cabeçalho com o logo e o slogan -->
        <header class="site-header">
            <!-- Aqui será o logo 'Granduh'. Pode ser um <h1> estilizado ou uma imagem <img> -->
            <h1 class="logo">Granduh</h1>
            <p class="tagline">EXPERIÊNCIAS, QUE MARCAM MOMENTOS!</p>
        </header>

        <!-- O cartão principal de conteúdo, centralizado na página, que contém todos os elementos -->
        <main class="content-card">
            <!-- Seção de navegação com os botões de ação -->
                        <nav class="links-navigation">
                <a href="https://api.whatsapp.com/send/?phone=5563991335436&text&type=phone_number&app_absent=0" class="action-button">
                    <span>Orçamento para Eventos</span>
                    <i class="fab fa-whatsapp"></i>
                </a>
                <!-- Novo botão para o menu feito do zero -->
                <a href="menu-do-zero.html" class="action-button">
                    <span>Menu do nosso Café</span>
                    <i class="fas fa-scroll"></i> <!-- Ícone de pergaminho para menu textual -->
                </a>
                <a href="https://www.instagram.com/buffetgranduh/" class="action-button">
                    <span>Conheça nosso Espaço</span>
                    <i class="fas fa-eye"></i>
                </a>
                <a href="https://share.google/QjooSn7MTpg4clOXf" class="action-button">
                    <span>Localização</span>
                    <i class="fas fa-map-marker-alt"></i>
                </a>
            </nav>

            <!-- Seção de informações de funcionamento -->
            <section class="schedule-info">
                <h2 class="schedule-title">Funcionamento</h2>
                <div class="schedule-item">
                    <p class="schedule-category">Espaço de Eventos:</p>
                    <p class="schedule-details">Segunda à Sexta: 9:00 h - 19:00 h e Sábado exclusivo para eventos</p>
                </div>
                <div class="schedule-item">
                    <p class="schedule-category">Café Bistrô:</p>
                    <p class="schedule-details">Segunda à Sexta: 10:00 h - 19:00 h</p>
                </div>
            </section>

            <!-- Rodapé do cartão com o link para o Instagram -->
            <footer class="social-link">
                <a href="https://www.instagram.com/buffetgranduh/" class="instagram-profile">
                    <i class="fab fa-instagram"></i>
                    <span>@buffetgranduh</span> <!-- Placeholder para o usuário do Instagram -->
                </a>
            </footer>
        </main>
    </div>
</body>
</html>
