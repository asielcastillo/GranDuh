<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Granduh - Menu Carrossel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css"> <!-- Para estilos globais como fontes, cores, etc. -->
    <link rel="stylesheet" href="menu-styles.css"> <!-- Estilos específicos para o menu -->
</head>
<body>
    <div class="menu-page-container">
        <header class="menu-header">
            <a href="index.html" class="back-button">
                <i class="fas fa-arrow-left"></i> Voltar
            </a>
            <h1 class="menu-title">Nosso Menu</h1>
            <p class="menu-subtitle">Desfrute dos nossos sabores!</p>
        </header>

        <section id="carousel-menu" class="menu-section">
            <h2>Menu em Carrossel</h2>
            <p>Use as setas para navegar entre as páginas do nosso menu.</p>
            <div class="carousel-container">
                <div class="carousel-track">
                    <!--
                        !!! IMPORTANTE: SUBSTITUA ESTES PLACEHOLDERS PELAS SUAS IMAGENS DO MENU !!!
                        Lembre-se de otimizar as imagens (compressão, redimensionamento) antes de usá-las.
                        Exemplo: <img src="caminho/para/sua/imagem-menu-carrossel1.webp" alt="Menu Granduh Carrossel 1" class="carousel-image">
                    -->
                    <img src="file/menu-lanche.jpg" alt="Menu Granduh Carrossel 1" class="carousel-image">
                    <img src="file/menu-lanches-2.jpg" alt="Menu Granduh Carrossel 2" class="carousel-image">
                    <img src="file/menu-brunch.jpg" alt="Menu Granduh Carrossel 3" class="carousel-image">
                    <img src="file/menu-doces.jpg" alt="Menu Granduh Carrossel 4" class="carousel-image">
                    <img src="file/menu-combo.jpg" alt="Menu Granduh Carrossel 5" class="carousel-image">
                    <img src="file/menu-cafe.jpg" alt="Menu Granduh Carrossel 6" class="carousel-image">
                    <img src="file/menu-bebidas.jpg" alt="Menu Granduh Carrossel 7" class="carousel-image">
                    <!-- Adicione mais imagens conforme a quantidade de páginas do seu menu -->
                </div>
                <button class="carousel-button prev">&lt;</button>
                <button class="carousel-button next">&gt;</button>
            </div>
            <div class="carousel-dots"></div> <!-- Indicadores de página -->
        </section>

    </div>

    <!-- Script JavaScript para o carrossel -->
    <script src="menu-carousel.js"></script>
</body>
</html>
